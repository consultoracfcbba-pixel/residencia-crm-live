<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Residencia CRM LIVE</title>
<style>
:root{--y:#ffcf22;--b:#070707;--p:#121212;--l:#292929;--w:#f8f8f5;--m:#a4a4a0}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--w);font-family:Arial,sans-serif}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{border-right:1px solid var(--l);padding:24px 18px;display:flex;flex-direction:column;gap:18px}.logo{width:100%;height:72px;object-fit:contain}.chip{background:var(--y);color:#000;padding:5px 8px;border-radius:999px;font-weight:800;font-size:11px;display:inline-block}.nav{display:grid;gap:8px}.nav button{background:transparent;color:var(--m);border:1px solid transparent;padding:13px;border-radius:12px;text-align:left;font-weight:700;cursor:pointer}.nav button.active,.nav button:hover{background:var(--y);color:#000}.main{min-width:0}.top{position:sticky;top:0;z-index:2;background:rgba(7,7,7,.93);border-bottom:1px solid var(--l);padding:22px 32px;display:flex;justify-content:space-between;align-items:center}.ey{color:var(--y);font-size:11px;font-weight:800;letter-spacing:.14em}.top h1{margin:4px 0 0}.btn{border:1px solid #444;background:#111;color:white;padding:11px 14px;border-radius:11px;font-weight:800;cursor:pointer}.btn.primary{background:var(--y);color:#000;border-color:var(--y)}.view{display:none;padding:30px 32px}.view.active{display:block}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,1fr)}.kpi,.panel{background:linear-gradient(145deg,#151515,#0c0c0c);border:1px solid var(--l);border-radius:18px;padding:20px}.kpi span{color:var(--m);font-size:12px}.kpi strong{display:block;font-size:30px;margin:10px 0 4px}.split{grid-template-columns:1.3fr .7fr;margin-top:16px}.panel h2{margin-top:0}.sub{color:var(--m);font-size:12px}.bar{height:9px;background:#222;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:var(--y)}.row{display:grid;grid-template-columns:120px 1fr 45px;gap:10px;align-items:center;margin:13px 0;font-size:12px}.cards{grid-template-columns:repeat(3,1fr)}.card{border:1px solid var(--l);border-radius:16px;overflow:hidden;background:#101010}.photo{height:180px;background:linear-gradient(135deg,#252525,#0c0c0c);display:grid;place-items:center;font-size:48px;color:var(--y)}.card-body{padding:15px}.price{color:var(--y);font-size:21px;font-weight:900}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.meta span{background:#1d1d1d;padding:6px 8px;border-radius:8px;font-size:10px}.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}.filters input,.filters select,.form input,.form select,.form textarea{width:100%;background:#0d0d0d;border:1px solid #333;color:#fff;border-radius:10px;padding:11px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:6px}.field label{font-size:11px;color:#c8c8c5;font-weight:800}.full{grid-column:1/-1}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid #242424;padding:12px;text-align:left;font-size:12px}.table th{color:#aaa}.badge{padding:5px 8px;border-radius:999px;background:rgba(255,207,34,.12);color:var(--y);font-size:10px;font-weight:800}.toast{position:fixed;right:20px;bottom:20px;background:#fff;color:#000;padding:12px 16px;border-radius:10px;opacity:0;transform:translateY(20px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:fixed;bottom:0;left:0;right:0;height:auto;z-index:5;background:#080808;border-top:1px solid #292929;border-right:0;padding:8px}.side .logo,.side .chip{display:none}.nav{grid-template-columns:repeat(5,1fr)}.nav button{text-align:center;padding:9px 4px;font-size:10px}.main{padding-bottom:70px}.kpis,.cards{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.filters{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.top{padding:16px}.view{padding:18px 14px}.kpis,.cards,.form{grid-template-columns:1fr}.top .btn{font-size:10px;padding:9px}.filters{grid-template-columns:1fr 1fr}}

Bbm5uYePHigc480rIMRHHaADqeFcZHjZnrY5ssnpdd7l7kniA9CVXX43g+X6T+38I47KaxXoVKp3LhxI5RNAYgT/af6+fn5+/fva94pwPR/QIfeuzEp8Gw0GqaHoNX+wtBBcbjNQFwI76A4vF+k+SyAM0gps9ms6VEABrx69Ur/Tr/55hv9O/X..." alt="Residencia"><span class="chip">CRM LIVE · DEMO</span><nav class="nav">
<button class="active" data-v="dashboard">Panel</button><button data-v="capture">Captación</button><button data-v="gallery">Galería LIVE</button><button data-v="clients">Clientes</button><button data-v="reports">Reportes</button></nav></aside>
<main class="main"><header class="top"><div><div class="ey">RESIDENCIA / OPERACIONES</div><h1 id="title">Panel ejecutivo</h1></div><button class="btn primary" id="newCap">+ Nueva captación</button></header>
<section id="dashboard" class="view active"></section><section id="capture" class="view"></section><section id="gallery" class="view"></section><section id="clients" class="view"></section><section id="reports" class="view"></section></main></div><div id="toast" class="toast"></div>
<script>
const seed={properties:[{code:'RES-001',title:'Departamento premium en Cala Cala',operation:'Venta',type:'Departamento',zone:'Cala Cala',price:168000,area:148,bedrooms:3,bathrooms:3,parking:2,status:'Activo'},{code:'RES-002',title:'Casa familiar con jardín',operation:'Venta',type:'Casa',zone:'Tiquipaya',price:245000,area:420,bedrooms:4,bathrooms:4,parking:3,status:'Activo'},{code:'RES-003',title:'Departamento ejecutivo',operation:'Alquiler',type:'Departamento',zone:'Queru Queru',price:780,area:92,bedrooms:2,bathrooms:2,parking:1,status:'Activo'}],clients:[{name:'Cliente ejemplo A',budget:190000,zone:'Cala Cala',bedrooms:3,status:'Calificado'},{name:'Cliente ejemplo B',budget:300000,zone:'Tiquipaya',bedrooms:4,status:'Visita'}],visits:1,reports:[]};
let db=JSON.parse(localStorage.getItem('residencia_demo')||'null')||seed;const save=()=>localStorage.setItem('residencia_demo',JSON.stringify(db));
const money=n=>new Intl.NumberFormat('es-BO',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n);const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
const titles={dashboard:'Panel ejecutivo',capture:'Nueva captación',gallery:'Galería comercial LIVE',clients:'Clientes y coincidencias',reports:'Reportes gerenciales'};
function nav(v){$$('.view').forEach(x=>x.classList.toggle('active',x.id===v));$$('[data-v]').forEach(x=>x.classList.toggle('active',x.dataset.v===v));$('#title').textContent=titles[v];render();}
$$('[data-v]').forEach(b=>b.onclick=()=>nav(b.dataset.v));$('#newCap').onclick=()=>nav('capture');
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function render(){renderDash();renderCap();renderGallery();renderClients();renderReports()}
function renderDash(){const a=db.properties.filter(x=>x.status==='Activo');const val=a.filter(x=>x.operation==='Venta').reduce((s,x)=>s+x.price,0);const zones={};a.forEach(x=>zones[x.zone]=(zones[x.zone]||0)+1);const max=Math.max(1,...Object.values(zones));$('#dashboard').innerHTML='<div class="grid kpis">'+[['Cartera activa',a.length],['Valor en venta',money(val)],['Prospectos',db.clients.length],['Visitas 7 días',db.visits]].map(x=>'<div class="kpi"><span>'+x[0]+'</span><strong>'+x[1]+'</strong><span>Actualizado en esta sesión</span></div>').join('')+'</div><div class="grid split"><article class="panel"><h2>Pipeline comercial</h2><p class="sub">Lectura rápida de la operación</p>'+[['Captaciones',db.properties.length],['Activas',a.length],['Clientes',db.clients.length],['Visitas',db.visits]].map(x=>'<div class="row"><span>'+x[0]+'</span><div class="bar"><i style="width:'+Math.min(100,x[1]/Math.max(1,db.properties.length)*100)+'%"></i></div><b>'+x[1]+'</b></div>').join('')+'</article><article class="panel"><h2>Zonas con mayor cartera</h2>'+Object.entries(zones).map(([z,n])=>'<div class="row"><span>'+z+'</span><div class="bar"><i style="width:'+n/max*100+'%"></i></div><b>'+n+'</b></div>').join('')+'</article></div>'}
function renderCap(){$('#capture').innerHTML='<article class="panel"><h2>Captación profesional</h2><p class="sub">Registro operativo que alimenta inmediatamente la galería.</p><form id="capForm" class="form"><div class="field"><label>Título comercial</label><input name="title" required placeholder="Departamento premium..."></div><div class="field"><label>Operación</label><select name="operation"><option>Venta</option><option>Alquiler</option><option>Anticrético</option></select></div><div class="field"><label>Tipo</label><select name="type"><option>Departamento</option><option>Casa</option><option>Terreno</option><option>Oficina</option><option>Local comercial</option></select></div><div class="field"><label>Zona</label><input name="zone" required placeholder="Cala Cala"></div><div class="field"><label>Precio USD</label><input name="price" type="number" required></div><div class="field"><label>Superficie m²</label><input name="area" type="number" required></div><div class="field"><label>Dormitorios</label><input name="bedrooms" type="number" value="2"></div><div class="field"><label>Baños</label><input name="bathrooms" type="number" value="2"></div><div class="field"><label>Parqueos</label><input name="parking" type="number" value="1"></div><div class="field"><label>Estado</label><select name="status"><option>Activo</option><option>Borrador</option></select></div><div class="field full"><label>Observaciones de captación</label><textarea rows="4" placeholder="Motivo del propietario, documentación, disponibilidad para visitas..."></textarea></div><div class="full"><button class="btn primary">Publicar captación</button></div></form></article>';$('#capForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);db.properties.unshift({code:'RES-'+String(Date.now()).slice(-4),title:f.get('title'),operation:f.get('operation'),type:f.get('type'),zone:f.get('zone'),price:+f.get('price'),area:+f.get('area'),bedrooms:+f.get('bedrooms'),bathrooms:+f.get('bathrooms'),parking:+f.get('parking'),status:f.get('status')});save();toast('Captación publicada en la galería LIVE');nav('gallery')}}
function renderGallery(){const cards=db.properties.map(p=>'<article class="card"><div class="photo">⌂</div><div class="card-body"><span class="badge">'+p.code+'</span><h3>'+p.title+'</h3><div class="sub">'+p.zone+' · '+p.operation+'</div><div class="price">'+money(p.price)+'</div><div class="meta"><span>'+p.area+' m²</span><span>'+p.bedrooms+' dorm.</span><span>'+p.bathrooms+' baños</span><span>'+p.parking+' parqueos</span></div><button class="btn" onclick="toast(\'Ficha comercial abierta\')">Ver ficha</button> <button class="btn primary" onclick="db.visits++;save();toast(\'Visita registrada\');render()">Agendar visita</button></div></article>').join('');$('#gallery').innerHTML='<div class="filters"><input id="qZone" placeholder="Zona"><input id="qMax" type="number" placeholder="Precio máx."><select id="qBeds"><option value="">Dormitorios</option><option>2</option><option>3</option><option>4</option></select><select id="qType"><option value="">Tipo</option><option>Departamento</option><option>Casa</option><option>Terreno</option></select><button class="btn primary" id="apply">Filtrar cartera</button></div><div class="grid cards" id="cards">'+cards+'</div>';$('#apply').onclick=()=>{const z=$('#qZone').value.toLowerCase(),m=+$('#qMax').value,b=+$('#qBeds').value,t=$('#qType').value;const fs=db.properties.filter(p=>(!z||p.zone.toLowerCase().includes(z))&&(!m||p.price<=m)&&(!b||p.bedrooms>=b)&&(!t||p.type===t));$('#cards').innerHTML=fs.map(p=>'<article class="card"><div class="photo">⌂</div><div class="card-body"><span class="badge">'+p.code+'</span><h3>'+p.title+'</h3><div class="sub">'+p.zone+'</div><div class="price">'+money(p.price)+'</div><div class="meta"><span>'+p.area+' m²</span><span>'+p.bedrooms+' dorm.</span><span>'+p.bathrooms+' baños</span></div></div></article>').join('')||'<div class="panel">No hay coincidencias con estos filtros.</div>'}}
function renderClients(){$('#clients').innerHTML='<article class="panel"><h2>Clientes y motor de coincidencias</h2><table class="table"><thead><tr><th>Cliente</th><th>Zona</th><th>Presupuesto</th><th>Dorm.</th><th>Estado</th><th>Coincidencias</th></tr></thead><tbody>'+db.clients.map(c=>{const n=db.properties.filter(p=>p.status==='Activo'&&p.price<=c.budget&&p.bedrooms>=c.bedrooms&&p.zone.toLowerCase().includes(c.zone.toLowerCase())).length;return '<tr><td>'+c.name+'</td><td>'+c.zone+'</td><td>'+money(c.budget)+'</td><td>'+c.bedrooms+'</td><td><span class="badge">'+c.status+'</span></td><td><b>'+n+'</b></td></tr>'}).join('')+'</tbody></table></article>'}
function renderReports(){const active=db.properties.filter(p=>p.status==='Activo');$('#reports').innerHTML='<div class="grid split"><article class="panel"><h2>Snapshot gerencial</h2><p class="sub">Guarda un punto histórico para comparar la operación.</p><div class="kpi"><span>Valor cartera venta</span><strong>'+money(active.filter(p=>p.operation==='Venta').reduce((s,p)=>s+p.price,0))+'</strong></div><button class="btn primary" id="snap">Guardar snapshot</button></article><article class="panel"><h2>Historial</h2><p class="sub">'+db.reports.length+' reportes almacenados en esta demo local.</p><table class="table"><tbody>'+db.reports.map(r=>'<tr><td>'+r.date+'</td><td>'+r.active+' activas</td><td>'+r.clients+' clientes</td></tr>').join('')+'</tbody></table></article></div>';$('#snap').onclick=()=>{db.reports.unshift({date:new Date().toLocaleString('es-BO'),active:active.length,clients:db.clients.length});save();toast('Snapshot guardado');renderReports()}}
render();
</script></body></html>
